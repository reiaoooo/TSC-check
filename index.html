<style>
  .result-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
    table-layout: fixed; /* 横に伸びすぎ防止 */
  }

  .result-table th, .result-table td {
    border: 1px solid #ccc;
    padding: 6px;
    word-wrap: break-word; /* 長い文字を折り返す */
    text-align: center;
  }

  .result-table th {
    background: #f0f0f0;
    font-weight: bold;
  }

  /* 当選 → 緑 */
  .win {
    background: #d8f5d0;
  }

  /* 落選 → 赤 */
  .lose {
    background: #f5d0d0;
  }

  /* 判定できない → グレー */
  .unknown {
    background: #eee;
  }

  /* スマホ対応 */
  @media (max-width: 600px) {
    .result-table {
      font-size: 12px;
    }
    .result-table th, .result-table td {
      padding: 4px;
    }
  }

  .total-sum {
    margin-top: 10px;
    font-size: 18px;
    font-weight: bold;
  }
</style>
