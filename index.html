<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>当落一括確認ツール</title>

<style>
  .result-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
    table-layout: fixed;
  }

  .result-table th, .result-table td {
    border: 1px solid #ccc;
    padding: 6px;
    word-wrap: break-word;
    text-align: center;
  }

  .result-table th {
    background: #f0f0f0;
    font-weight: bold;
  }

  .win {
    background: #d8f5d0;
  }

  .lose {
    background: #f5d0d0;
  }

  .unknown {
    background: #eee;
  }

  @media (max-width: 600px) {
    .result-table {
      font-size: 12px;
    }
    .result-table th, .result-table td {
      padding: 4px;
    }
  }

  .total-sum {
    margin-top: 10px;
    font-size: 18px;
    font-weight: bold;
  }

  body {
    font-family: sans-serif;
    padding: 20px;
  }

  textarea {
    width: 100%;
    height: 120px;
  }

  input {
    width: 100%;
    padding: 8px;
    margin-bottom: 10px;
  }

  button {
    padding: 10px 20px;
    font-size: 16px;
  }
</style>
</head>

<body>

<h2>当落一括確認ツール</h2>

<label>電話番号（11桁）</label>
<input id="tel" placeholder="例：07012345678">

<label>受付番号（複数行OK）</label>
<textarea id="entries" placeholder="例：1234&#10;5678&#10;9012"></textarea>

<button id="run">一括確認する</button>

<div id="result" style="margin-top:20px;"></div>

<script src="script.js"></script>

</body>
</html>
